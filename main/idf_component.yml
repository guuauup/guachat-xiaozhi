## IDF Component Manager Manifest File
## Only the components the GUACHAT 2G4 firmware uses directly are declared here;
## everything else is pulled in transitively by their own manifests.
dependencies:
  idf:
    version: '>=6.0.1'

  # UI
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.9.0
  78/xiaozhi-fonts: ~2.0.0
  # Animated idle-face expressions: 21 Otto robot GIFs (240x240), read straight
  # out of the component's gifs/ directory by scripts/build_default_assets.py.
  txp666/otto-emoji-gif-component: ~1.4.0

  # Display and input
  espressif/esp_lcd_st7796: ~1.4.0
  espressif/esp_lcd_touch_ft5x06: ^1.1.1
  espressif/button: ~4.2.1

  # Networking and provisioning
  78/esp-wifi-connect: ~3.3.1
  78/esp-ml307: ~3.7.0

  # Audio
  espressif/esp-sr: ==2.4.7
  espressif/esp_audio_codec: ~2.5.0
  espressif/esp_audio_effects: ~1.3.0

  # Image handling
  espressif/esp_new_jpeg: ^1.0.2
  espressif/esp_image_effects: ^1.1.0

  # JSON
  espressif/cjson: ^1.7.19
